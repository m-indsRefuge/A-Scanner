name: Prepare v0.1.2

on:
  push:
    branches: ["release/v0.1.2"]
    paths: [".github/workflows/prepare-v0.1.2.yml"]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v0.1.2
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Update release metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match for {old!r}, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once("pyproject.toml", 'version = "0.1.1"', 'version = "0.1.2"')
          replace_once("src/a_scanner/__init__.py", '__version__ = "0.1.1"', '__version__ = "0.1.2"')

          replace_once(
              "CHANGELOG.md",
              "## Unreleased\n\nSecurity and robustness hardening from the 2026-08-29 external Meta AI code audit, independently verified against the live repository before remediation.",
              "## Unreleased\n\n## 0.1.2 — 2026-08-29\n\nSecurity and robustness hardening from the 2026-08-29 external Meta AI code audit, independently verified against the live repository before remediation.",
          )

          replace_once("README.md", "**Current release:** `v0.1.1`", "**Current release:** `v0.1.2`")
          replace_once("README.md", "## What V0.1.1 supports", "## What V0.1.2 supports")
          replace_once(
              "README.md",
              "The current unreleased hardening work additionally disables npm lifecycle scripts during the update step by default, bounds validation fingerprinting of large untracked files, rejects missing explicit config paths, improves malformed inventory handling, and writes report evidence atomically.",
              "V0.1.2 additionally disables npm lifecycle scripts during the update step by default, bounds validation fingerprinting of large untracked files, rejects missing explicit config paths, improves malformed inventory handling, and writes report evidence atomically.",
          )
          replace_once(
              "README.md",
              "The initial public distribution is a wheel attached to the GitHub Release for `v0.1.1`.",
              "The current public distribution is a wheel attached to the GitHub Release for `v0.1.2`.",
          )
          replace_once(
              "README.md",
              "After downloading `a_scanner-0.1.1-py3-none-any.whl` from the Releases page:",
              "After downloading `a_scanner-0.1.2-py3-none-any.whl` from the Releases page:",
          )
          replace_once(
              "README.md",
              "uv tool install .\\a_scanner-0.1.1-py3-none-any.whl",
              "uv tool install .\\a_scanner-0.1.2-py3-none-any.whl",
          )

          dollar = chr(36)
          head_sha_expr = dollar + "{{ github.event.workflow_run.head_sha }}"
          token_expr = dollar + "{{ secrets.GITHUB_TOKEN }}"
          release_workflow = '''name: Release v0.1.2

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout verified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: __HEAD_SHA__
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY2'
          from pathlib import Path
          import tomllib

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          if project["project"]["version"] != "0.1.2":
              raise SystemExit("pyproject version is not 0.1.2; release skipped")

          namespace = {}
          exec(Path("src/a_scanner/__init__.py").read_text(encoding="utf-8"), namespace)
          if namespace["__version__"] != "0.1.2":
              raise SystemExit("package __version__ is not 0.1.2; release skipped")
          PY2
          uv sync --all-groups --python 3.12 --locked

      - name: Build and smoke-test release artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          uv build
          test -f dist/a_scanner-0.1.2-py3-none-any.whl
          test -f dist/a_scanner-0.1.2.tar.gz
          uv venv /tmp/a-scanner-release-smoke --python 3.12
          uv pip install --python /tmp/a-scanner-release-smoke/bin/python dist/a_scanner-0.1.2-py3-none-any.whl
          test "$(/tmp/a-scanner-release-smoke/bin/a-scan --version)" = "a-scan 0.1.2"
          sha256sum dist/a_scanner-0.1.2-py3-none-any.whl dist/a_scanner-0.1.2.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: __TOKEN__
          RELEASE_SHA: __HEAD_SHA__
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.1.2 >/dev/null 2>&1; then
            echo "v0.1.2 already exists; refusing to overwrite it."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v0.1.2 >/dev/null 2>&1; then
            echo "Tag v0.1.2 exists without a matching release; refusing to mutate it."
            exit 1
          fi

          cat > RELEASE_NOTES.md <<EOF
          # A-Scanner v0.1.2 — External Audit Hardening

          This alpha release publishes the security and robustness hardening independently verified from the 2026-08-29 Meta AI code audit.

          ## Highlights

          - npm lifecycle scripts are disabled during `npm update` by default; trusted repositories can explicitly opt in.
          - Missing explicit config paths and malformed npm/uv inventory now fail closed instead of producing misleading fallback results.
          - Git status parsing is NUL-safe for rename/copy records and detected project paths are constrained to the repository.
          - Worktree fingerprinting rejects oversized non-ignored untracked files instead of consuming unbounded I/O.
          - Validation regexes are bounded and cached, report writes are atomic, and command resolution no longer trusts command-specific PATH overrides.

          APPLY mode remains for trusted repositories only because configured/discovered validation commands can execute repository code.

          ## Verification

          The exact release commit passed the normal CI matrix on Windows and Ubuntu with Python 3.12 and 3.13 before this release job was allowed to run. This job then rebuilt the artifacts from that verified commit, installed the wheel into a fresh Python 3.12 environment, and verified `a-scan --version` returned `a-scan 0.1.2`.

          Release commit: `$RELEASE_SHA`

          ## SHA-256

          ```text
          $(cat SHA256SUMS.txt)
          ```
          EOF

          gh release create v0.1.2 \
            dist/a_scanner-0.1.2-py3-none-any.whl \
            dist/a_scanner-0.1.2.tar.gz \
            SHA256SUMS.txt \
            --target "$RELEASE_SHA" \
            --title "A-Scanner v0.1.2 — External Audit Hardening" \
            --notes-file RELEASE_NOTES.md \
            --prerelease
          '''
          release_workflow = release_workflow.replace("__HEAD_SHA__", head_sha_expr).replace("__TOKEN__", token_expr)
          Path(".github/workflows/release-v0.1.2.yml").write_text(release_workflow, encoding="utf-8")
          Path(".github/workflows/prepare-v0.1.2.yml").unlink()
          PY

      - name: Refresh lockfile and verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          uv lock
          uv sync --all-groups --python 3.12 --locked
          uv run --python 3.12 pytest
          uv run --python 3.12 ruff check .
          uv run --python 3.12 ruff format --check .
          git diff --check

      - name: Commit prepared release branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock src/a_scanner/__init__.py README.md CHANGELOG.md .github/workflows/release-v0.1.2.yml .github/workflows/prepare-v0.1.2.yml
          git commit -m "chore: prepare A-Scanner v0.1.2 release"
          git push origin HEAD:release/v0.1.2
