name: Prepare v0.1.2

on:
  push:
    branches: ["release/v0.1.2"]
    paths: [".github/workflows/prepare-v0.1.2.yml"]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v0.1.2
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Update version and release metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match for {old!r}, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once("pyproject.toml", 'version = "0.1.1"', 'version = "0.1.2"')
          replace_once("src/a_scanner/__init__.py", '__version__ = "0.1.1"', '__version__ = "0.1.2"')
          replace_once(
              "CHANGELOG.md",
              "## Unreleased\n\nSecurity and robustness hardening from the 2026-08-29 external Meta AI code audit, independently verified against the live repository before remediation.",
              "## Unreleased\n\n## 0.1.2 — 2026-08-29\n\nSecurity and robustness hardening from the 2026-08-29 external Meta AI code audit, independently verified against the live repository before remediation.",
          )
          replace_once("README.md", "**Current release:** `v0.1.1`  \n", "**Current release:** `v0.1.2`\n")
          replace_once("README.md", "## What V0.1.1 supports", "## What V0.1.2 supports")
          replace_once(
              "README.md",
              "The current unreleased hardening work additionally disables npm lifecycle scripts during the update step by default, bounds validation fingerprinting of large untracked files, rejects missing explicit config paths, improves malformed inventory handling, and writes report evidence atomically.",
              "V0.1.2 additionally disables npm lifecycle scripts during the update step by default, bounds validation fingerprinting of large untracked files, rejects missing explicit config paths, improves malformed inventory handling, and writes report evidence atomically.",
          )
          replace_once(
              "README.md",
              "The initial public distribution is a wheel attached to the GitHub Release for `v0.1.1`.",
              "The current public distribution is a wheel attached to the GitHub Release for `v0.1.2`.",
          )
          replace_once(
              "README.md",
              "After downloading `a_scanner-0.1.1-py3-none-any.whl` from the Releases page:",
              "After downloading `a_scanner-0.1.2-py3-none-any.whl` from the Releases page:",
          )
          replace_once(
              "README.md",
              "uv tool install .\\a_scanner-0.1.1-py3-none-any.whl",
              "uv tool install .\\a_scanner-0.1.2-py3-none-any.whl",
          )
          Path(".github/workflows/prepare-v0.1.2.yml").unlink()
          PY

      - name: Refresh lockfile and verify release branch
        shell: bash
        run: |
          set -euo pipefail
          uv lock
          uv sync --all-groups --python 3.12 --locked
          uv run --python 3.12 pytest
          uv run --python 3.12 ruff check .
          uv run --python 3.12 ruff format --check .
          git diff --check

      - name: Commit prepared release branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: prepare A-Scanner v0.1.2 release"
          git push origin HEAD:release/v0.1.2
