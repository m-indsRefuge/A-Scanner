name: Release v0.1.2

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout verified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Verify, build, and smoke-test
        shell: bash
        run: |
          set -euo pipefail
          uv sync --all-groups --python 3.12 --locked
          uv run --python 3.12 python -c "import a_scanner; assert a_scanner.__version__ == '0.1.2'"
          rm -rf dist
          uv build
          test -f dist/a_scanner-0.1.2-py3-none-any.whl
          test -f dist/a_scanner-0.1.2.tar.gz
          uv venv /tmp/a-scanner-release-smoke --python 3.12
          uv pip install --python /tmp/a-scanner-release-smoke/bin/python dist/a_scanner-0.1.2-py3-none-any.whl
          test "$(/tmp/a-scanner-release-smoke/bin/a-scan --version)" = "a-scan 0.1.2"
          sha256sum dist/a_scanner-0.1.2-py3-none-any.whl dist/a_scanner-0.1.2.tar.gz > SHA256SUMS.txt

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.1.2 >/dev/null 2>&1; then
            echo "v0.1.2 already exists; refusing to overwrite it."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v0.1.2 >/dev/null 2>&1; then
            echo "Tag v0.1.2 exists without a matching release; refusing to mutate it."
            exit 1
          fi
          printf '%s\n' \
            '# A-Scanner v0.1.2 — External Audit Hardening' \
            '' \
            'This alpha release publishes the security and robustness hardening independently verified from the 2026-08-29 Meta AI code audit.' \
            '' \
            '## Highlights' \
            '' \
            '- npm lifecycle scripts are disabled during `npm update` by default; trusted repositories can explicitly opt in.' \
            '- Missing explicit config paths and malformed npm/uv inventory now fail closed instead of producing misleading fallback results.' \
            '- Git rename/copy parsing and repository-boundary checks were hardened.' \
            '- Worktree fingerprinting rejects oversized non-ignored untracked files instead of consuming unbounded I/O.' \
            '- Validation regexes are bounded and cached, report writes are atomic, and command resolution no longer trusts command-specific PATH overrides.' \
            '' \
            'APPLY mode remains for trusted repositories only because configured/discovered validation commands can execute repository code.' \
            '' \
            '## Verification' \
            '' \
            'The exact release commit passed CI on Windows and Ubuntu with Python 3.12 and 3.13 before publication. The release job rebuilt the artifacts from that verified commit and installed the wheel into a fresh Python 3.12 environment.' \
            > RELEASE_NOTES.md
          printf '\nRelease commit: `%s`\n\n## SHA-256\n\n```text\n' "$RELEASE_SHA" >> RELEASE_NOTES.md
          cat SHA256SUMS.txt >> RELEASE_NOTES.md
          printf '```\n' >> RELEASE_NOTES.md
          gh release create v0.1.2 dist/a_scanner-0.1.2-py3-none-any.whl dist/a_scanner-0.1.2.tar.gz SHA256SUMS.txt --target "$RELEASE_SHA" --title "A-Scanner v0.1.2 — External Audit Hardening" --notes-file RELEASE_NOTES.md --prerelease
