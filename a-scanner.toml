schema_version = 1

[scan]
# Canonical environment, cache, test-workspace, and build exclusions are automatic.
# Add repository-specific directory names here; entries are matched by directory name.
exclude = []

[warning]
patterns = [
  "DeprecationWarning",
  "FutureWarning",
  "deprecated",
  "deprecation",
  "will be removed",
  "no longer supported",
  "legacy API",
]

[[validation.commands]]
name = "Ruff lint"
argv = ["uv", "run", "ruff", "check", "."]

[[validation.commands]]
name = "Ruff format"
argv = ["uv", "run", "ruff", "format", "--check", "."]

[[validation.commands]]
name = "Pytest"
argv = ["uv", "run", "pytest"]
