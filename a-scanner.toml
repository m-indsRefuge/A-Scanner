schema_version = 1

[scan]
exclude = [
  ".git",
  ".venv",
  "node_modules",
  "dist",
  "build",
  ".a-scanner",
]

[warning]
patterns = [
  "DeprecationWarning",
  "FutureWarning",
  "deprecated",
  "deprecation",
  "will be removed",
  "no longer supported",
  "legacy API",
]

[[validation.commands]]
name = "Ruff lint"
argv = ["uv", "run", "ruff", "check", "."]

[[validation.commands]]
name = "Ruff format"
argv = ["uv", "run", "ruff", "format", "--check", "."]

[[validation.commands]]
name = "Pytest"
argv = ["uv", "run", "pytest"]
