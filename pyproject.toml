[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "a-scanner"
version = "0.1.1"
description = "A lightweight deterministic dependency scanner and compatible updater."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "Nolan Augustine" }
]
keywords = ["dependencies", "deprecation", "scanner", "cli", "uv", "npm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Repository = "https://github.com/m-indsRefuge/A-Scanner"
Issues = "https://github.com/m-indsRefuge/A-Scanner/issues"

[project.scripts]
a-scan = "a_scanner.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4",
  "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/a_scanner"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest-tmp -p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
